<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="outside">
            <div class="container">
                <div class="screen">
                    <div class="screen-content">
                        
                    </div>
                </div>
                <div class="btn-container">
                    <div class="up-opr">
                        <div class="upBtn clear">AC</div>
                        <div class="upBtn opr">/</div>
                        <div class="upBtn opr">*</div>
                        <div class="upBtn opr">-</div>
                    </div>
                    <div class="digits">
                        <div class="dig btn">7</div>
                        <div class="dig btn">8</div>
                        <div class="dig btn">9</div>
                        <div class="dig btn">4</div>
                        <div class="dig btn">5</div>
                        <div class="dig btn">6</div>
                        <div class="dig btn">1</div>
                        <div class="dig btn">2</div>
                        <div class="dig btn">3</div>
                        <div class="dig btn bottomLeft ">0</div>
                        <div class="dig btn bottomRight">.</div>
                    </div>
                    <div class="right-opr">
                        <div class="rightTop opr rightBtn">+</div>
                        <div class="rightBottom enter rightBtn">=</div>
                    </div>
                </div>
            </div>
        </div>
        
    </main>
    <script src="script.js"></script>
</body>
</html>
