<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
    <header>
        <div class="navbar">
            <div class="nav_logo border"></div>
            <div class="nav_2 border">
                <p class="line1">deliver to</p>
                <i class="fa-solid fa-location-dot"></i>
                <p class="line2">India</p>
            </div>
            <div class="searchbar">
                <select name="all" id="search_select">
                    <option value="all">all</option>
                </select>
                <input type="text" placeholder="search amazon">
                <div class="icon"><i class="fa-solid fa-magnifying-glass"></i></div>
            </div>
            <div class="language border">
                <select name="language" id="language">
                    <option value="english">en</option>
                    <option value="hindi">हिंदी</option>
                </select>
            </div>
            <div class="signin border">
                <p class="line1">hello sign in</p>
                <p class="line2">account & list<i class="fa-solid fa-caret-down"></i></p>
            </div>
            <div class="return border">
                <p class="line1">returns</p>
                <p class="line2">& orders</p>
            </div>
            <div class="cart border">
                <i class="fa-solid fa-cart-shopping"></i>
                <p>cart</p>
            </div>
        </div>
        <div class="deskbar">
            <div class="all border"><i class="fa-solid fa-bars"></i>all</div>
            <ul>
                <li class="border">today's deal</li>
                <li class="border">prime video</li>
                <li class="border">gift card</li>
                <li class="border">sell</li>
                <li class="border">registory</li>
                <li class="border">coustumer service</li>
            </ul>
        </div>
    </header>
    <section>
        <div class="heroPage">
            <i class="fa-solid fa-angle-left border"></i>
            <i class="fa-solid fa-angle-right border"></i>
        </div>
    </section>
</body>
</html>
